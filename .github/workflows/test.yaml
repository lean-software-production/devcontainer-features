name: "Test features"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the dev container CLI
        run: npm install -g @devcontainers/cli

      - name: Test Fabro
        run: devcontainer features test --features fabro --skip-duplicated .

      - name: Test Pi
        run: >-
          devcontainer features test --features pi
          --base-image mcr.microsoft.com/devcontainers/javascript-node:5-24-trixie
          --remote-user node --skip-duplicated .

      - name: Test Claude Code
        run: >-
          devcontainer features test --features claude-code
          --base-image mcr.microsoft.com/devcontainers/javascript-node:5-24-trixie
          --remote-user node --skip-duplicated .

      - name: Test Codex
        run: >-
          devcontainer features test --features codex
          --base-image mcr.microsoft.com/devcontainers/javascript-node:5-24-trixie
          --remote-user node --skip-duplicated .

      - name: Test BB Feature
        run: >-
          devcontainer features test --features bb
          --base-image mcr.microsoft.com/devcontainers/javascript-node:5-24-trixie
          --remote-user node --skip-duplicated .

      - name: Test BB option rejection
        run: bash test/bb/adversarial-options.sh

      - name: Test BB lifecycle adversarial cases
        run: sudo bash test/bb/adversarial-runtime.sh

      - name: Test Tutor Feature
        run: >-
          devcontainer features test --features tutor
          --skip-autogenerated --skip-duplicated .

      - name: Test Tutor option rejection
        run: bash test/tutor/adversarial-options.sh

      - name: Test Tutor lifecycle hooks
        run: sudo bash test/tutor/lifecycle-hermetic.sh

      - name: Check the Tutor Codespace's Feature copies
        run: .devcontainer/tutor/sync-features.sh --check

      - name: Test the Tutor Codespace entry point
        run: bash test/tutor/codespace-entry.sh
