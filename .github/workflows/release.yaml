name: "Release features"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to ghcr.io (uncheck to validate metadata only)"
        type: boolean
        default: true

permissions:
  # contents: write is required because generate-docs commits the regenerated
  # feature README, and the action tags the repo for each released Feature.
  contents: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish features to ghcr.io
        uses: devcontainers/action@v1
        with:
          publish-features: ${{ inputs.publish }}
          validate-only: ${{ !inputs.publish }}
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
