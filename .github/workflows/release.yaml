name: "Release features"

# Runs by itself after "Test features" passes on a push to main, so merging a
# version bump releases it. devcontainers/action publishes only versions that
# are not on ghcr.io yet, so a merge that bumps nothing publishes nothing.
# workflow_dispatch stays for re-running a release or validating metadata.
on:
  workflow_run:
    workflows: ["Test features"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to ghcr.io (uncheck to validate metadata only)"
        type: boolean
        default: true

permissions:
  # contents: write is required because the action git-tags the repo for each
  # released Feature, and because the docs step below pushes a commit.
  contents: write
  packages: write

# One release at a time; a second waits rather than racing the first's tags.
concurrency:
  group: release-features
  cancel-in-progress: false

jobs:
  deploy:
    # Automatic runs only for a successful test run of a push to main: never
    # for a pull request's run, and never for a failed one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # An automatic run always publishes; a manual one follows its input.
      PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
    steps:
      # Release exactly the commit that was tested, not whatever main is now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Publish features to ghcr.io
        uses: devcontainers/action@v1
        with:
          publish-features: ${{ env.PUBLISH }}
          validate-only: ${{ env.PUBLISH != 'true' }}
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # generate-docs only writes the README files into the workspace; the
      # action never commits them. Without this step they are discarded when
      # the runner is torn down. If main has moved on since the tested commit
      # the push is refused; the next release regenerates the same docs.
      - name: Commit generated documentation
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./src/**/README.md
          if git diff --cached --quiet; then
            echo "Documentation is already up to date."
          else
            git commit -m "Update generated feature documentation [skip ci]"
            git push origin HEAD:main \
              || echo "::warning::main moved on since the tested commit; the generated documentation will be committed by the next release."
          fi
