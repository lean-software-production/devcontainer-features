name: "Release features"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to ghcr.io (uncheck to validate metadata only)"
        type: boolean
        default: true

permissions:
  # contents: write is required because the action git-tags the repo for each
  # released Feature, and because the docs step below pushes a commit.
  contents: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish features to ghcr.io
        uses: devcontainers/action@v1
        with:
          publish-features: ${{ inputs.publish }}
          validate-only: ${{ !inputs.publish }}
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # generate-docs only writes the README files into the workspace; the
      # action never commits them. Without this step they are discarded when
      # the runner is torn down.
      - name: Commit generated documentation
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./src/**/README.md
          if git diff --cached --quiet; then
            echo "Documentation is already up to date."
          else
            git commit -m "Update generated feature documentation [skip ci]"
            git push origin HEAD:main
          fi
