name: "Test features"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the dev container CLI
        run: npm install -g @devcontainers/cli

      - name: Test the fabro feature
        run: devcontainer features test --features fabro --skip-duplicated .
